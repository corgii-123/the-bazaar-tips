<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大巴扎 The Bazaar · S15 全职业攻略</title>
<style>
  /* ============ 设计令牌：夜巴扎 ============ */
  :root{
    --bg:#160F2B; --bg2:#1E1540; --panel:#241A4A; --panel2:#2C2158;
    --line:rgba(232,180,90,.18); --line2:rgba(255,255,255,.08);
    --ink:#F2EAD9; --muted:#9B92BC; --dim:#6E6694;
    --brass:#E8B45A;
    /* 物品/阶段沿用游戏内品阶色：青铜→白银→黄金→钻石→传说 */
    --bronze:#C08552; --silver:#AEBBD0; --gold:#E8B45A; --diamond:#7FD6E8; --legend:#C77DFF;
    --danger:#E87A7A; --ok:#8FD6A0;
    --serif:"Songti SC","Noto Serif CJK SC","SimSun",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;
    background-image:radial-gradient(1200px 500px at 70% -10%, rgba(199,125,255,.10), transparent 60%),
                     radial-gradient(900px 400px at 10% 0%, rgba(232,180,90,.08), transparent 55%);}
  a{color:var(--diamond);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1060px;margin:0 auto;padding:0 20px}

  /* ============ 顶栏 ============ */
  header.site{padding:34px 0 18px;border-bottom:1px solid var(--line)}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--brass);text-transform:uppercase}
  h1.site-title{font-family:var(--serif);font-weight:700;font-size:clamp(28px,4.5vw,42px);letter-spacing:.04em;margin:6px 0 4px}
  h1 .en{color:var(--muted);font-size:.55em;font-family:var(--mono);letter-spacing:.08em;font-weight:400;margin-left:.6em}
  .site-sub{color:var(--muted);font-size:13.5px;max-width:760px}
  .meta-badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .badge{font-family:var(--mono);font-size:12px;padding:4px 12px;border:1px solid var(--line);border-radius:3px;color:var(--brass);background:rgba(232,180,90,.06)}
  .badge.soft{color:var(--muted);border-color:var(--line2);background:transparent}

  /* ============ 导航 ============ */
  nav.tabs{position:sticky;top:0;z-index:50;background:rgba(22,15,43,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2)}
  nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;padding-top:8px;padding-bottom:0;scrollbar-width:none}
  nav.tabs .wrap::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 16px 11px;cursor:pointer;border:0;background:none;color:var(--muted);font-family:var(--sans);font-size:14px;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tab .dot{width:7px;height:7px;border-radius:50%;background:var(--hue,var(--brass));opacity:.85}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink);border-bottom-color:var(--hue,var(--brass))}
  .tab .nick{font-size:11.5px;color:var(--dim)}

  main{padding:28px 0 80px}
  section.page{display:none}
  section.page.active{display:block;animation:fadeUp .25s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){section.page.active{animation:none}}

  /* ============ 通用排版 ============ */
  h2{font-family:var(--serif);font-size:24px;letter-spacing:.05em;margin:34px 0 14px;display:flex;align-items:baseline;gap:10px}
  h2 .en{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.12em;font-weight:400}
  h3{font-family:var(--serif);font-size:17px;letter-spacing:.04em;margin:0 0 8px}
  p.lead{color:var(--muted);max-width:820px}
  .panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line2);border-radius:8px;padding:18px 20px}
  ul.plain{list-style:none}
  ul.plain li{padding:5px 0 5px 18px;position:relative;color:var(--ink)}
  ul.plain li::before{content:"";position:absolute;left:2px;top:14px;width:7px;height:7px;border:1.5px solid var(--brass);border-radius:1px;transform:rotate(45deg)}
  ul.plain li .sub{color:var(--muted)}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{border:1px solid var(--line2);padding:8px 12px;text-align:left;vertical-align:top}
  th{background:rgba(232,180,90,.07);font-family:var(--mono);font-size:12px;color:var(--brass);letter-spacing:.08em;font-weight:500}
  td .mono{font-family:var(--mono);font-size:12.5px}

  /* ============ 英雄页头 ============ */
  .hero-head{border:1px solid var(--line2);border-left:3px solid var(--hue,var(--brass));border-radius:8px;padding:22px 24px;background:
    linear-gradient(115deg, color-mix(in srgb, var(--hue,#E8B45A) 14%, var(--bg2)) 0%, var(--bg2) 55%)}
  .hero-head .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px}
  .hero-name{font-family:var(--serif);font-size:32px;letter-spacing:.05em}
  .hero-name .en{font-family:var(--mono);font-size:14px;color:var(--muted);letter-spacing:.1em;margin-left:10px}
  .hero-nick{font-size:13px;color:var(--bg);background:var(--hue,var(--brass));padding:2px 10px;border-radius:3px;font-weight:600}
  .hero-tags{margin-top:8px;color:var(--muted);font-size:13.5px}
  .stat-row{display:flex;gap:26px;margin-top:14px;flex-wrap:wrap}
  .stat .k{font-family:var(--mono);font-size:11px;letter-spacing:.15em;color:var(--dim)}
  .stat .v{font-size:15px;color:var(--ink)}
  .stat .v.tier{color:var(--brass);font-family:var(--mono);font-weight:700}
  .pips{display:inline-flex;gap:3px;vertical-align:-1px}
  .pip{width:9px;height:9px;border:1px solid var(--dim);transform:rotate(45deg)}
  .pip.on{background:var(--hue,var(--brass));border-color:var(--hue,var(--brass))}
  .s15-note{margin-top:14px;padding:10px 14px;border-left:2px solid var(--brass);background:rgba(232,180,90,.06);font-size:13.5px;color:var(--ink)}
  .s15-note b{color:var(--brass)}

  /* ============ 阶段轨道（签名元素）============ */
  .rail{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:30px 0 6px;border-radius:6px;overflow:hidden;border:1px solid var(--line2)}
  .rail .seg{padding:10px 14px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;display:flex;justify-content:space-between;gap:8px;color:var(--bg);font-weight:700}
  .rail .seg span.days{font-weight:400;opacity:.8}
  .rail .seg.e{background:linear-gradient(90deg,#9c6a3e,var(--bronze))}
  .rail .seg.m{background:linear-gradient(90deg,#c79038,var(--gold))}
  .rail .seg.l{background:linear-gradient(90deg,#54aec2,var(--diamond))}

  .phase{margin:18px 0 26px;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  .phase>header{padding:12px 18px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line2);background:rgba(255,255,255,.025)}
  .phase>header .pname{font-family:var(--serif);font-size:18px}
  .phase>header .pdays{font-family:var(--mono);font-size:12px;letter-spacing:.1em}
  .phase.e>header .pdays{color:var(--bronze)} .phase.m>header .pdays{color:var(--gold)} .phase.l>header .pdays{color:var(--diamond)}
  .phase .grid{display:grid;grid-template-columns:1.1fr 1fr;gap:0}
  .phase .cell{padding:16px 18px}
  .phase .cell+.cell{border-left:1px solid var(--line2)}
  .phase .cell.full{grid-column:1/-1;border-top:1px solid var(--line2);border-left:0}
  .cell .ct{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:var(--brass);margin-bottom:10px}
  ol.shops{list-style:none;counter-reset:s}
  ol.shops li{counter-increment:s;padding:6px 0 6px 34px;position:relative;border-bottom:1px dashed var(--line2)}
  ol.shops li:last-child{border-bottom:0}
  ol.shops li::before{content:counter(s);position:absolute;left:0;top:7px;width:22px;height:22px;border:1px solid var(--brass);border-radius:50%;color:var(--brass);font-family:var(--mono);font-size:11px;display:flex;align-items:center;justify-content:center}
  ol.shops li .why{display:block;color:var(--muted);font-size:12.5px}

  /* ============ 卡牌芯片：英文名 + 中文注释 ============ */
  .cards{display:flex;flex-direction:column;gap:8px}
  .card{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;padding:8px 12px;border:1px solid var(--line2);border-left:3px solid var(--rolec,var(--silver));border-radius:5px;background:rgba(255,255,255,.02)}
  .card .cname{font-family:var(--mono);font-size:13px;color:var(--ink);font-weight:600;grid-column:1}
  .card .role{grid-column:2;justify-self:end;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--rolec,var(--silver));align-self:center}
  .card .cn{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
  .card.r-core{--rolec:var(--legend)} .card.r-engine{--rolec:var(--gold)}
  .card.r-filler{--rolec:var(--bronze)} .card.r-tech{--rolec:var(--diamond)} .card.r-skill{--rolec:var(--ok)}
  .legend-roles{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted);margin:8px 0 0}
  .legend-roles i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

  /* ============ 流派卡 ============ */
  .builds{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
  .build{border:1px solid var(--line2);border-radius:8px;padding:16px 18px;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
  .build .bt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
  .build .bt .btier{font-family:var(--mono);font-size:12px;color:var(--brass);border:1px solid var(--line);padding:1px 8px;border-radius:3px}
  .build .onset{font-family:var(--mono);font-size:11.5px;color:var(--diamond);margin-bottom:8px}
  .build p.desc{color:var(--muted);font-size:13px;margin-bottom:12px}
  .bounds{margin-top:12px;display:grid;gap:6px;font-size:12.5px}
  .bounds .b{padding:7px 10px;border-radius:4px}
  .bounds .up{background:rgba(143,214,160,.08);border-left:2px solid var(--ok)}
  .bounds .down{background:rgba(232,122,122,.08);border-left:2px solid var(--danger)}
  .bounds b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;margin-right:6px}
  .bounds .up b{color:var(--ok)} .bounds .down b{color:var(--danger)}

  /* ============ 上限/下限总评 ============ */
  .hero-bounds{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .hero-bounds .panel{border-top:2px solid var(--ok)}
  .hero-bounds .panel.low{border-top-color:var(--danger)}
  .hero-bounds .ct{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;margin-bottom:8px}
  .hero-bounds .panel .ct{color:var(--ok)} .hero-bounds .panel.low .ct{color:var(--danger)}

  /* ============ 梯队表 ============ */
  .tierlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .tierrow{display:grid;grid-template-columns:74px 1fr;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
  .tierrow .tl{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:16px;color:var(--bg)}
  .tierrow .tr{padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.02)}
  .hero-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:4px;padding:5px 12px;cursor:pointer;background:var(--bg2);color:var(--ink);font-size:13.5px}
  .hero-chip:hover{border-color:var(--brass)}
  .hero-chip .dot{width:8px;height:8px;border-radius:50%}

  /* ============ 更新面板 ============ */
  .update-box textarea{width:100%;min-height:130px;background:#100B22;color:#CFE8D8;border:1px solid var(--line2);border-radius:6px;font-family:var(--mono);font-size:12px;padding:12px;margin:10px 0}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  button.btn{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;padding:8px 16px;border-radius:4px;border:1px solid var(--brass);background:rgba(232,180,90,.1);color:var(--brass);cursor:pointer}
  button.btn:hover{background:rgba(232,180,90,.2)}
  button.btn.ghost{border-color:var(--line2);color:var(--muted);background:transparent}
  .msg{font-family:var(--mono);font-size:12px;margin-top:8px}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--danger)}
  code.k{font-family:var(--mono);font-size:12.5px;color:var(--brass);background:rgba(232,180,90,.08);padding:1px 6px;border-radius:3px}

  footer.site{border-top:1px solid var(--line2);padding:22px 0 40px;color:var(--dim);font-size:12.5px}
  footer .src{font-family:var(--mono)}

  @media (max-width:760px){
    .phase .grid{grid-template-columns:1fr}
    .phase .cell+.cell{border-left:0;border-top:1px solid var(--line2)}
    .hero-bounds{grid-template-columns:1fr}
    .rail .seg span.days{display:none}
  }
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <div class="kicker">The Bazaar · Season 15 · 赛季初版本</div>
    <h1 class="site-title">大巴扎七职业攻略集<span class="en">GRAND BAZAAR LEDGER</span></h1>
    <p class="site-sub">覆盖全部 7 个英雄的前 / 中 / 后期抓牌顺序、进店顺序、路线目标与强度上下限。卡牌一律英文原名 + 中文注释，方便对照游戏内英文客户端。S15 数据不足处以 S12–S14 主流思路推演补全，并已标注。</p>
    <div class="meta-badges" id="metaBadges"></div>
  </div>
</header>

<nav class="tabs"><div class="wrap" id="tabBar"></div></nav>

<main><div class="wrap" id="content"></div></main>

<footer class="site">
  <div class="wrap">
    <div class="src" id="footSrc"></div>
    <p style="margin-top:8px">本页为玩家自制攻略整理，与 Tempo 官方无关。卡牌强度随热修频繁变动，以游戏内实际描述为准。</p>
  </div>
</footer>

<script>
/* ════════════════════════════════════════════════════════════════════
   ▼▼▼ 攻 略 数 据 区（GUIDE_DATA）▼▼▼
   未来版本更新只需要改这一个对象（或把新 JSON 粘贴进页面底部的更新面板）。
   页面所有内容均由此数据渲染，不需要动任何 HTML / CSS / 渲染代码。

   字段速查：
   meta            赛季号、数据日期、变更日志、数据来源
   general         总览页：运营通识（天数节奏 / 商人 / 经济 / 打野）
   tiers           职业梯队（数组，从高到低）
   heroes[].builds 每职业 3 套 S15 主流流派；cards.role 取值：
                   core=核心  engine=引擎  filler=过渡  tech=反制/工具  skill=技能
   heroes[].phases 前/中/后期；每期含 goals(路线目标) picks(抓牌顺序，按优先级排列)
                   shops(进店顺序) tips(注意点)
   heroes[].bounds 该职业整体的上限 / 下限
   ════════════════════════════════════════════════════════════════════ */
const GUIDE_DATA = {
  meta: {
    season: "S15",
    dataDate: "2026-06-05",
    siteVersion: "1.0.0",
    confidence: "S15 赛季初：流派框架取自 Mobalytics 6 月 S15 元数据；运营细节参考 S12–S14 社区共识，可能随热修变动",
    sources: [
      { name: "Mobalytics · S15 Meta Builds", url: "https://mobalytics.gg/the-bazaar/guides/meta-builds" },
      { name: "Mobalytics · Patch Notes Tracker", url: "https://mobalytics.gg/the-bazaar/guides/patch-notes" },
      { name: "BazaarDB · 全卡数据库/统计", url: "https://bazaardb.gg" },
      { name: "BazaarForge · 出场率 T 表", url: "https://bazaarforge.gg" },
      { name: "B 站国服社区 S14 攻略（济海 / 阿榑阿福 / 憨猪在度假 等）", url: "https://search.bilibili.com/all?keyword=大巴扎攻略" }
    ],
    changelog: [
      { date: "2026-06-10", text: "v1.0.0 建站：S15 赛季初 7 职业全量攻略上线" }
    ]
  },

  general: {
    intro: "大巴扎一局的本质是「用有限的时间和金币，把随机货架拼成一台能打 10 胜的机器」。每一天你在地图上选择遭遇（商人 / 奇遇 / 野怪），日终与其他玩家的镜像盘面结算 PVP；累计 10 胜毕业，血量归零出局。所以所有职业的运营都绕不开三个问题：这一天进哪些店、店里抓什么、这一阶段我要打成什么样。",
    blocks: [
      { title: "天数节奏（通用三段论）", items: [
        "前期 Day 1–4｜青铜·拼节奏：货架以青铜物品为主，目标不是定流派，而是『今天的盘面能打赢今天的对手』。能赢就赢，赢不了优先保血。",
        "中期 Day 5–9｜黄金·定主轴：白银/黄金商人陆续出现，核心件开始可见。这一段必须做出流派抉择——继续杂凑必输后期。",
        "后期 Day 10+｜钻石·拉上限：钻石及以上货架解锁，工作是把核心升品、上附魔、补反制件（冻结 / 减速 / 摧毁对策），向 10 胜冲刺。"
      ]},
      { title: "商人与进店通识", items: [
        "商人按品阶分级：青铜商人 Day 1 即可出现、刷新便宜（约 2 金）但商品最杂；白银 / 黄金 / 钻石商人随天数解锁，越高级越贵、商品越精。",
        "进店优先级的底层逻辑：本系专卖店（武器 / 水族 / 科技 / 药剂 / 食物 / 兽群）> 综合商人 > 技能商人 > 附魔类奇遇。找特定核心去专卖店，捡漏去综合店。",
        "刷新（Reroll）是把双刃剑：前期 2 金刷新约等于半件装备，没有明确目标不要乱刷；中期为定轴可以连刷，后期为关键附魔 / 升品值得重金刷。",
        "技能商人和精英怪是技能两大来源：版本强力通用技能（如暴击系、灼烧系）优先级常常高于一件普通装备。"
      ]},
      { title: "经济与等级", items: [
        "金币每天有基础收入，部分物品 / 奇遇提供额外收入或增值（Value）。S12 起场外刷钱被大砍，纯经济流收益下降——经济件点到为止，盘面强度优先。",
        "经验升级给属性与技能选择。升级节奏跟着野怪走：野怪 = 金币 + 经验 + 战利品三合一，是性价比最高的遭遇。",
        "卖货时机：过渡件在『有更好的替代品上场的那一刻』卖掉；带任务 / 增值的物品看清触发条件再卖。"
      ]},
      { title: "打野（PVE）通识", items: [
        "野怪强度有梯度：开打前看清怪物盘面（武器伤害型 / 灼烧毒型 / 护盾拖延型），用自己当前盘面克制的类型去换战利品。",
        "精英怪掉落关键技能与高品物品，是中期质变的主要来源——但翻车 = 白送血量，没把握宁可打小怪。",
        "S15 赛季初野怪池有调整（如 Strange Mushroom、Jungle Ruins、Tiny Furry Monster 等低阶遭遇可持续到 Day 3），前 3 天的打野收益比以往更稳定。"
      ]}

          { en: "减速/控制件", cn: "把对手拖进自己的节奏", role: "tech" }
        ],
        shops: [

      down: "下限：机制（激怒/自减速）理解门槛高，节奏算错就是自废武功；新线攻略少，下限非常吃个人熟练度。"

/* ════════════════ ▲▲▲ 数据区结束，以下为渲染代码（无需改动）▲▲▲ ════════════════ */

const ROLE_NAMES = { core:"核心", engine:"引擎", filler:"过渡", tech:"反制", skill:"技能" };
const ROLE_COLORS = { core:"var(--legend)", engine:"var(--gold)", filler:"var(--bronze)", tech:"var(--diamond)", skill:"var(--ok)" };
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const rich = s => esc(s).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>");

function cardChip(c){
  return `<div class="card r-${c.role||'filler'}">
    <div class="cname">${esc(c.en)}</div>
    <div class="role">${ROLE_NAMES[c.role]||"过渡"}</div>
    <div class="cn">${esc(c.cn)}</div></div>`;
}
function pips(n){ let h=""; for(let i=1;i<=5;i++) h+=`<span class="pip${i<=n?' on':''}"></span>`; return `<span class="pips">${h}</span>`; }

function renderHero(h){
  const builds = h.builds.map(b=>`
    <article class="build">
      <div class="bt"><h3>${esc(b.name)}</h3><span class="btier">${esc(b.tier)}</span></div>
      <div class="onset">⏱ ${esc(b.onset)}</div>
      <p class="desc">${rich(b.desc)}</p>
      <div class="cards">${b.cards.map(cardChip).join("")}</div>
      <div class="bounds">
        <div class="b up"><b>上限</b>${esc(b.ceiling)}</div>
        <div class="b down"><b>下限</b>${esc(b.floor)}</div>
      </div>
    </article>`).join("");

  const phases = h.phases.map(p=>`
    <article class="phase ${p.key}">
      <header><span class="pname">${esc(p.name)}</span><span class="pdays">${esc(p.days)}</span></header>
      <div class="grid">
        <div class="cell"><div class="ct">路线目标 GOALS</div>
          <ul class="plain">${p.goals.map(g=>`<li>${rich(g)}</li>`).join("")}</ul></div>
        <div class="cell"><div class="ct">进店顺序 SHOP ORDER</div>
          <ol class="shops">${p.shops.map(s=>`<li>${esc(s.s)}<span class="why">${esc(s.why)}</span></li>`).join("")}</ol></div>
        <div class="cell full"><div class="ct">抓牌顺序 PICK PRIORITY（从上到下）</div>
          <div class="cards">${p.picks.map(cardChip).join("")}</div></div>
        ${p.tips?.length?`<div class="cell full"><div class="ct">注意点 NOTES</div>
          <ul class="plain">${p.tips.map(t=>`<li class="sub">${rich(t)}</li>`).join("")}</ul></div>`:""}
      </div>
    </article>`).join("");

  return `
  <div style="--hue:${h.hue}">
    <div class="hero-head">
      <div class="row">
        <span class="hero-name">${esc(h.cn)}<span class="en">${esc(h.en)}</span></span>
        <span class="hero-nick">${esc(h.nick)}</span>
      </div>
      <div class="hero-tags">${esc(h.tagline)}</div>
      <div class="stat-row">
        <div class="stat"><div class="k">梯队 TIER</div><div class="v tier">${esc(h.tier)}</div></div>
        <div class="stat"><div class="k">上手难度</div><div class="v">${pips(h.difficulty)}</div></div>
      </div>
      <div class="s15-note"><b>S15 变动</b> · ${rich(h.s15)}</div>
    </div>

    <h2>主流流派 <span class="en">META BUILDS · S15</span></h2>
    <div class="legend-roles">
      <span><i style="background:${ROLE_COLORS.core}"></i>核心 CORE</span>
      <span><i style="background:${ROLE_COLORS.engine}"></i>引擎 ENGINE</span>
      <span><i style="background:${ROLE_COLORS.filler}"></i>过渡 FILLER</span>
      <span><i style="background:${ROLE_COLORS.tech}"></i>反制/工具 TECH</span>
      <span><i style="background:${ROLE_COLORS.skill}"></i>技能 SKILL</span>
    </div>
    <div class="builds">${builds}</div>

    <h2>分阶段运营 <span class="en">ROUTE BY PHASE</span></h2>
    <div class="rail">
      <div class="seg e">前期<span class="days">DAY 1–4 · 青铜</span></div>
      <div class="seg m">中期<span class="days">DAY 5–9 · 黄金</span></div>
      <div class="seg l">后期<span class="days">DAY 10+ · 钻石</span></div>
    </div>
    ${phases}

    <h2>职业上下限总评 <span class="en">CEILING / FLOOR</span></h2>
    <div class="hero-bounds">
      <div class="panel"><div class="ct">上限 CEILING</div>${esc(h.bounds.up)}</div>
      <div class="panel low"><div class="ct">下限 FLOOR</div>${esc(h.bounds.down)}</div>
    </div>
  </div>`;
}

function renderOverview(d){
  const heroById = Object.fromEntries(d.heroes.map(h=>[h.id,h]));
  const tiers = d.tiers.map(t=>`
    <div class="tierrow">
      <div class="tl" style="background:${t.tier==="T0"?"var(--legend)":t.tier==="T1"?"var(--gold)":t.tier==="T1.5"?"var(--silver)":"var(--bronze)"}">${esc(t.tier)}</div>
      <div class="tr">
        ${t.heroes.map(id=>{const h=heroById[id];return h?`<button class="hero-chip" data-goto="${h.id}"><span class="dot" style="background:${h.hue}"></span>${esc(h.cn)} · ${esc(h.nick)}</button>`:""}).join("")}
        <span style="color:var(--dim);font-size:12.5px;align-self:center">${esc(t.note)}</span>
      </div>
    </div>`).join("");

  const blocks = d.general.blocks.map(b=>`
    <div class="panel" style="margin-top:14px"><h3>${esc(b.title)}</h3>
      <ul class="plain">${b.items.map(i=>`<li>${rich(i)}</li>`).join("")}</ul></div>`).join("");

  const log = d.meta.changelog.map(c=>`<tr><td class="mono">${esc(c.date)}</td><td>${esc(c.text)}</td></tr>`).join("");

  return `
    <h2 style="margin-top:6px">赛季速览 <span class="en">SEASON ${esc(d.meta.season)} OVERVIEW</span></h2>
    <p class="lead">${esc(d.general.intro)}</p>
    <h2>职业梯队（赛季初参考，争议大，热修后会变）<span class="en">TIER LIST</span></h2>
    <div class="tierlist">${tiers}</div>
    <h2>通用运营 <span class="en">FUNDAMENTALS</span></h2>
    ${blocks}

    <h2>如何更新本攻略 <span class="en">HOW TO UPDATE</span></h2>
    <div class="panel update-box">
      <ul class="plain">
        <li><b>方式一（推荐）</b>：打开本 HTML 文件，所有内容都在顶部 <code class="k">GUIDE_DATA</code> 一个对象里——改数据即改全站，渲染代码永远不用动。新增流派/卡牌只需照着现有条目复制一份。</li>
        <li><b>方式二（AI 协作）</b>：把新赛季补丁说明丢给 AI，让它“只输出更新后的 GUIDE_DATA 对象”，整段替换即可，一分钟完成版本迭代。</li>
        <li><b>方式三（临时热更）</b>：把新的 GUIDE_DATA JSON 粘贴到下方文本框点「应用」，页面立即用新数据重渲染（仅本次打开有效，刷新还原）。可先点「导出当前数据」拿到模板。</li>
      </ul>
      <textarea id="jsonIn" placeholder='粘贴完整的 GUIDE_DATA JSON（可先点“导出当前数据”获取模板）…' spellcheck="false"></textarea>
      <div class="btnrow">
        <button class="btn" id="btnApply">应用粘贴的数据</button>
        <button class="btn ghost" id="btnExport">导出当前数据（复制到剪贴板）</button>
      </div>
      <div class="msg" id="jsonMsg"></div>
    </div>

    <h2>更新日志 <span class="en">CHANGELOG</span></h2>
    <table><thead><tr><th style="width:130px">日期</th><th>内容</th></tr></thead><tbody>${log}</tbody></table>`;
}

/* ── 渲染骨架 ── */
let DATA = GUIDE_DATA;
let currentPage = "overview";

function build(){
  const tabBar = document.getElementById("tabBar");
  const content = document.getElementById("content");
  const tabs = [{id:"overview", label:"总览", nick:"S"+ (DATA.meta.season||"").replace(/^S/,""), hue:"var(--brass)"}]
    .concat(DATA.heroes.map(h=>({id:h.id,label:h.cn,nick:h.nick,hue:h.hue})));

  tabBar.innerHTML = tabs.map(t=>
    `<button class="tab${t.id===currentPage?' active':''}" data-page="${t.id}" style="--hue:${t.hue}">
       <span class="dot"></span>${esc(t.label)}<span class="nick">${esc(t.nick)}</span></button>`).join("");

  content.innerHTML =
    `<section class="page${currentPage==='overview'?' active':''}" id="pg-overview">${renderOverview(DATA)}</section>` +
    DATA.heroes.map(h=>`<section class="page${currentPage===h.id?' active':''}" id="pg-${h.id}">${renderHero(h)}</section>`).join("");

  document.getElementById("metaBadges").innerHTML =
    `<span class="badge">SEASON ${esc(DATA.meta.season)}</span>
     <span class="badge soft">数据基准 ${esc(DATA.meta.dataDate)}</span>
     <span class="badge soft">v${esc(DATA.meta.siteVersion)}</span>
     <span class="badge soft" title="${esc(DATA.meta.confidence)}">ⓘ ${esc(DATA.meta.confidence.slice(0,28))}…</span>`;

  document.getElementById("footSrc").innerHTML = "数据来源：" +
    DATA.meta.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(" · ");

  tabBar.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
  content.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.goto)));
  bindUpdatePanel();
}

function go(id){
  currentPage = id;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.page===id));
  document.querySelectorAll("section.page").forEach(s=>s.classList.toggle("active",s.id==="pg-"+id));
  window.scrollTo({top:0});
}

function bindUpdatePanel(){
  const msg = document.getElementById("jsonMsg");
  const ta = document.getElementById("jsonIn");
  const apply = document.getElementById("btnApply");
  const exp = document.getElementById("btnExport");
  if(!apply) return;
  apply.addEventListener("click",()=>{
    try{
      const next = JSON.parse(ta.value);
      if(!next.heroes || !next.meta) throw new Error("缺少 heroes / meta 字段");
      DATA = next; currentPage = "overview"; build();
      document.getElementById("jsonMsg").className="msg ok";
      document.getElementById("jsonMsg").textContent="✓ 已应用新数据并重渲染（刷新页面将还原为文件内置数据）";
    }catch(e){ msg.className="msg err"; msg.textContent="✗ JSON 解析失败："+e.message; }
  });
  exp.addEventListener("click",async()=>{
    const txt = JSON.stringify(DATA,null,2);
    try{ await navigator.clipboard.writeText(txt); msg.className="msg ok"; msg.textContent="✓ 当前 GUIDE_DATA 已复制到剪贴板"; }
    catch(e){ ta.value = txt; msg.className="msg ok"; msg.textContent="✓ 已输出到文本框（剪贴板不可用时的降级方案）"; }
  });
}

build();
</script>
</body>
</html>
